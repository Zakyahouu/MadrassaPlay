<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Choice Quiz</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game-root">
      <header class="game-header">
        <h1 id="game-title">Quiz</h1>
        <div class="meta">
          <span id="question-counter">Question 0 / 0</span>
          <span id="score-display">Score: 0</span>
        </div>
      </header>

      <main>
        <section id="game-container" class="card hidden">
          <div class="question" id="question-text">Loading...</div>
          <div class="options" id="options-container"></div>
        </section>

        <section id="results-screen" class="card hidden">
          <h2>Results</h2>
          <p>Your score:</p>
          <div id="final-score" class="final-score">0 / 0</div>
          <button id="restart-button" class="btn">Restart</button>
        </section>
      </main>
    </div>

    <script src="./game.js"></script>
  </body>
  </html>
