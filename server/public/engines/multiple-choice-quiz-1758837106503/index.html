<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Wajibet Quiz</title>
	<link rel="stylesheet" href="style.css" />
	<script>
		window.addEventListener('contextmenu', e=> e.preventDefault());
	</script>
	<link rel="preload" as="script" href="game.js" />
	<script defer src="game.js"></script>
</head>
<body>
	<div class="container">
		<div id="ready-screen" class="screen">
    <div class="logo">🚀 Wajibet Quiz Ready!</div>
			<p>Get ready to test your knowledge.</p>
			<button id="enter-btn" class="btn">Start Game</button>
		</div>

		<div id="countdown-screen" class="screen hidden">
			<div class="count">3</div>
		</div>

		<div id="play-screen" class="screen hidden">
			<div class="hud">
				<div id="timer-display" class="hud-item left">
					<span class="icon">⏱️</span>
					<span class="text">30s</span>
				</div>
				<div id="q-idx" class="hud-item center">1 / 10</div>
				<div id="score-display" class="hud-item right">
					<span class="icon">★</span>
					<span class="text">0</span>
				</div>
			</div>

			<div id="question-card" class="question-card">
				<div id="timer-border" class="timer-border"></div>
				<div id="question-text" class="question"></div>
			</div>

			<div id="options-grid" class="options-grid">
				</div>
			
			<div id="explain-container" class="explain-container hidden">
				</div>

			<div id="action-bar" class="action-bar">
				<button id="next-btn" class="btn hidden">Next Question</button>
			</div>
		</div>

		<div id="done-screen" class="screen hidden">
			<div class="logo">🎉 Game Complete!</div>
			<div id="summary-text" class="summary-text"></div>
			<p>Thanks for playing.</p>
		</div>
	</div>
</body>
</html>
